# NodePress with PostgreSQL. Copy .env.example to .env, fill it in, then: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodepress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nodepress
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodepress -d nodepress']
      interval: 5s
      timeout: 5s
      retries: 20

  nodepress:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://nodepress:${POSTGRES_PASSWORD}@db:5432/nodepress
      SITE_NAME: ${SITE_NAME:-NodePress}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CONTACT_SECRET: ${CONTACT_SECRET:-}
      CONTACT_TO: ${CONTACT_TO:-}
      MAIL_URL: ${MAIL_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - nodepress-data:/data

volumes:
  db-data:
  nodepress-data:
