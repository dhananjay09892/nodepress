name: Measure block editor

# Run manually on a branch (Actions tab → "Run workflow", or the REST API). Builds the admin
# and prints the editor's gzip size and the server-render round trip, so the numbers in
# docs/adr/0001-editor.md come from a real build. Changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Measure editor
        run: node apps/admin/scripts/measure-editor.mjs
      - name: Tiptap and ProseMirror versions and licences
        run: |
          for p in @tiptap/core @tiptap/react @tiptap/starter-kit @tiptap/pm; do
            node -e "const p=require('./packages/editor/node_modules/$p/package.json');console.log(p.name,p.version,p.license)"
          done
