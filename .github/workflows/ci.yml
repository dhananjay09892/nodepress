name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nodepress
          POSTGRES_PASSWORD: nodepress
          POSTGRES_DB: nodepress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodepress -d nodepress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Cache only once pnpm-lock.yaml is committed.
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate DB migrations (until they are committed)
        if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - name: Build
        run: pnpm build
      - name: CLI scaffolds, checks and packs a plugin
        run: |
          set -e
          CLI="node packages/cli/dist/bin.js"
          WORK="$RUNNER_TEMP/cli-plugin"
          $CLI plugin create ci-example --dir "$WORK"
          $CLI plugin check "$WORK/ci-example"
          $CLI plugin pack "$WORK/ci-example" --out "$WORK/ci-example.zip"
          unzip -l "$WORK/ci-example.zip" | grep -q plugin.json
          $CLI theme create ci-theme --dir "$WORK"
          test -f "$WORK/ci-theme/theme.json"
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (SQLite in memory + PostgreSQL service)
        env:
          TEST_POSTGRES_URL: postgres://nodepress:nodepress@localhost:5432/nodepress_test
        run: pnpm test

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Start server and check it responds
        working-directory: apps/server
        env:
          PORT: 3000
          DATABASE_URL: file:./ci.db
          SITE_NAME: CI Site
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-admin-password-1234
          COOKIE_SECURE: 'false'
        run: |
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

          echo "--- /api/health ---"
          HEALTH=$(curl -fsS http://localhost:3000/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"name":"hello-nodepress","status":"active"'

          echo "--- / ---"
          PAGE=$(curl -fsS http://localhost:3000/)
          echo "$PAGE"
          echo "$PAGE" | grep -q "CI Site"
          echo "$PAGE" | grep -q "Thanks for reading!"
          echo "$PAGE" | grep -q 'class="np-aurora"'
          echo "$PAGE" | grep -q '<link rel="canonical" href="http://localhost:3000/"'
          echo "$PAGE" | grep -q 'property="og:site_name" content="CI Site"'

          echo "--- theme (404 page and assets) ---"
          STATUS=$(curl -s -o notfound.html -w '%{http_code}' http://localhost:3000/nothing-here)
          test "$STATUS" = "404"
          grep -q 'class="np-aurora"' notfound.html
          grep -q '/themes/aurora/assets/style.css' notfound.html
          curl -fsSI http://localhost:3000/themes/aurora/assets/style.css | tee style.headers
          grep -qi '^cache-control: public, max-age=86400' style.headers
          grep -qi '^etag:' style.headers

          echo "--- /admin/ ---"
          ADMIN=$(curl -fsS http://localhost:3000/admin/)
          echo "$ADMIN" | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/admin/login | grep -q '<div id="root">'

          echo "--- post body on the front end ---"
          curl -fsS -c cookies.txt -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"email":"ci-admin@example.com","password":"ci-admin-password-1234"}' \
            http://localhost:3000/api/v1/auth/login > login.json
          CSRF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('login.json','utf8')).csrfToken)")
          curl -fsS -b cookies.txt -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -H "x-csrf-token: $CSRF" \
            -d '{"title":"Smoke Page","slug":"smoke-page","status":"published","body":[{"type":"core/heading","attrs":{"level":2},"content":[{"text":"Smoke heading"}]},{"type":"core/paragraph","content":[{"text":"Smoke paragraph"}]},{"type":"core/list","attrs":{"ordered":false},"children":[{"type":"core/list-item","content":[{"text":"Smoke item"}]}]}]}' \
            http://localhost:3000/api/v1/content/page
          BODY=$(curl -fsS http://localhost:3000/smoke-page)
          echo "$BODY" | grep -q '<h2>Smoke heading</h2>'
          echo "$BODY" | grep -q '<p>Smoke paragraph</p>'
          echo "$BODY" | grep -q '<li>Smoke item</li>'

          echo "--- performance budget (cached pages: median and p95 under 100 ms) ---"
          node dist/perf-cli.js http://localhost:3000 / /smoke-page /sitemap.xml /feed.xml

          echo "Smoke test passed ✅"
      - name: Show server log
        if: always()
        run: cat apps/server/server.log || true

  installer-smoke:
    name: create-nodepress installer
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Create a site with the installer and run it
        run: |
          SITE_DIR="$RUNNER_TEMP/installer-site"
          node packages/create-nodepress/dist/bin.js "$SITE_DIR" --yes \
            --site-name "Installer Site" \
            --admin-email installer-admin@example.com \
            --admin-password installer-admin-password-1234 \
            --port 3100 --site-url http://localhost:3100 --from "$PWD"
          test -f "$SITE_DIR/.env"
          test "$(stat -c '%a' "$SITE_DIR/.env")" = "600"
          cd "$SITE_DIR"
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3100/api/health > /dev/null && break
            sleep 1
          done
          HEALTH=$(curl -fsS http://localhost:3100/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          curl -fsS http://localhost:3100/ | grep -q "Installer Site"
          curl -fsS http://localhost:3100/admin/ | grep -q '<div id="root">'
          curl -fsS -H 'content-type: application/json' -H 'origin: http://localhost:3100' \
            -d '{"email":"installer-admin@example.com","password":"installer-admin-password-1234"}' \
            http://localhost:3100/api/v1/auth/login | grep -q '"csrfToken"'
          test -f nodepress.db
          echo "Installer smoke test passed"
      - name: Show server log
        if: always()
        run: cat "$RUNNER_TEMP/installer-site/server.log" || true

  docker:
    name: Docker image and compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t nodepress:ci .
      - name: Run the image and check it
        run: |
          docker run -d --name np -p 3200:3000 -v np-data:/data \
            -e SITE_NAME="Docker Site" -e SITE_URL=http://localhost:3200 \
            -e ADMIN_EMAIL=docker-admin@example.com -e ADMIN_PASSWORD=docker-admin-password-1234 \
            -e COOKIE_SECURE=false nodepress:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:3200/api/health > /dev/null && break
            sleep 1
          done
          HEALTH=$(curl -fsS http://localhost:3200/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          curl -fsS http://localhost:3200/ | grep -q "Docker Site"
          curl -fsS http://localhost:3200/admin/ | grep -q '<div id="root">'
          curl -fsS -H 'content-type: application/json' -H 'origin: http://localhost:3200' \
            -d '{"email":"docker-admin@example.com","password":"docker-admin-password-1234"}' \
            http://localhost:3200/api/v1/auth/login | grep -q '"csrfToken"'
          test "$(docker exec np id -u)" != "0"
          docker exec np test -f /data/nodepress.db
          for i in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Health.Status}}' np)" = "healthy" && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' np)" = "healthy"
          echo "Docker image check passed"
      - name: Show container log
        if: always()
        run: docker logs np || true
      - name: Start the compose stack with PostgreSQL
        env:
          POSTGRES_PASSWORD: compose-postgres-password-1234
          ADMIN_EMAIL: compose-admin@example.com
          ADMIN_PASSWORD: compose-admin-password-1234
          SITE_NAME: Compose Site
          COOKIE_SECURE: 'false'
          PORT: 3300
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:3300/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3300/ | grep -q "Compose Site"
          curl -fsS -H 'content-type: application/json' -H 'origin: http://localhost:3300' \
            -d '{"email":"compose-admin@example.com","password":"compose-admin-password-1234"}' \
            http://localhost:3300/api/v1/auth/login | grep -q '"csrfToken"'
          echo "Compose check passed"
      - name: Show compose log
        if: always()
        env:
          POSTGRES_PASSWORD: compose-postgres-password-1234
          ADMIN_EMAIL: compose-admin@example.com
          ADMIN_PASSWORD: compose-admin-password-1234
        run: docker compose logs --no-color || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocks merges on high and critical advisories in production dependencies (N62). A new advisory
    # is fixed by a dependency bump, which Dependabot proposes weekly.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # This job never installs, so there is no pnpm store to cache; the automatic cache would
          # fail the job in its post step ("Path Validation Error") even when the audit passes.
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level=high

  admin-e2e:
    name: Admin end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Report editor size and server-render round trip
        run: |
          node apps/admin/scripts/measure-editor.mjs
          for p in @tiptap/core @tiptap/react @tiptap/starter-kit @tiptap/pm; do
            node -e "const p=require('./packages/editor/node_modules/$p/package.json');console.log(p.name,p.version,p.license)"
          done
      - name: Install Playwright browser
        run: pnpm --filter @nodepress/admin exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm --filter @nodepress/admin e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

  lighthouse:
    name: Aurora accessibility (Lighthouse >= 95)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Audit the blog and business layouts, light and dark
        working-directory: apps/server
        env:
          PORT: 3000
          DATABASE_URL: file:./lighthouse.db
          SITE_NAME: Aurora Audit
          THEME: aurora
          # A site without users shows the setup wizard instead of its pages.
          ADMIN_EMAIL: audit-admin@example.com
          ADMIN_PASSWORD: audit-admin-password-1234
        run: |
          set -e
          # The audited page: the front page, in both layouts. (Lighthouse refuses pages that answer 404.)
          # Dark mode is audited by emulating prefers-color-scheme: dark in Chrome.
          audit() {
            layout="$1"; scheme="$2"; path="$3"
            flags="--headless=new --no-sandbox"
            if [ "$scheme" = dark ]; then flags="$flags --blink-settings=preferredColorScheme=1"; fi
            THEME_SETTINGS="{\"layout\":\"$layout\"}" node dist/main.js > "server-$layout-$scheme.log" 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              curl -fs http://localhost:3000/api/health > /dev/null && break
              sleep 1
            done
            # Chrome sometimes fails to record the page load (NO_NAVSTART) on a busy runner. That is a
            # run that produced no score, not a bad score, so it is tried again (up to 3 times); the
            # score check below is never retried.
            ran=0
            for attempt in 1 2 3; do
              if npx --yes lighthouse@12.3.0 "http://localhost:3000$path" \
                --only-categories=accessibility,performance --output=json \
                --output-path="lh-$layout-$scheme.json" --quiet \
                --chrome-flags="$flags"; then ran=1; break; fi
              echo "Lighthouse did not produce a result (attempt $attempt of 3)"
            done
            [ "$ran" = 1 ]
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
            echo "$layout / $scheme / $path: accessibility $(jq '.categories.accessibility.score * 100' "lh-$layout-$scheme.json"), performance $(jq '.categories.performance.score * 100' "lh-$layout-$scheme.json")"
            jq -e '.categories.accessibility.score >= 0.95 and .categories.performance.score >= 0.95' "lh-$layout-$scheme.json" > /dev/null
          }
          audit blog light /
          audit business light /
          audit blog dark /
          audit business dark /
      - name: Show server logs
        if: always()
        run: cat apps/server/server-*.log || true
