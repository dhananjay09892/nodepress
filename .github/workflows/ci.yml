name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # TODO: add `pnpm format:check` after the first `pnpm format` run is committed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
