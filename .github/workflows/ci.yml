name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nodepress
          POSTGRES_PASSWORD: nodepress
          POSTGRES_DB: nodepress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodepress -d nodepress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Cache only once pnpm-lock.yaml is committed.
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate DB migrations (until they are committed)
        if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (SQLite in memory + PostgreSQL service)
        env:
          TEST_POSTGRES_URL: postgres://nodepress:nodepress@localhost:5432/nodepress_test
        run: pnpm test

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Start server and check it responds
        working-directory: apps/server
        env:
          PORT: 3000
          DATABASE_URL: file:./ci.db
          SITE_NAME: CI Site
        run: |
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

          echo "--- /api/health ---"
          HEALTH=$(curl -fsS http://localhost:3000/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"name":"hello-nodepress","status":"active"'

          echo "--- / ---"
          PAGE=$(curl -fsS http://localhost:3000/)
          echo "$PAGE"
          echo "$PAGE" | grep -q "CI Site"
          echo "$PAGE" | grep -q "Thanks for reading!"

          echo "--- /admin/ ---"
          ADMIN=$(curl -fsS http://localhost:3000/admin/)
          echo "$ADMIN" | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/admin/login | grep -q '<div id="root">'

          echo "Smoke test passed ✅"
      - name: Show server log
        if: always()
        run: cat apps/server/server.log || true

  admin-e2e:
    name: Admin end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm install --no-frozen-lockfile
      - if: hashFiles('packages/db/drizzle/sqlite/**') == '' || hashFiles('packages/db/drizzle/postgres/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm build
      - name: Report editor size and server-render round trip
        run: |
          node apps/admin/scripts/measure-editor.mjs
          for p in @tiptap/core @tiptap/react @tiptap/starter-kit @tiptap/pm; do
            node -e "const p=require('./packages/editor/node_modules/$p/package.json');console.log(p.name,p.version,p.license)"
          done
      - name: Install Playwright browser
        run: pnpm --filter @nodepress/admin exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm --filter @nodepress/admin e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
