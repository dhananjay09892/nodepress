name: Refresh lockfile and formatting

# Run manually on a branch (Actions tab → "Run workflow", or the REST API).
# Installs dependencies, regenerates missing DB migrations, formats the code,
# and commits pnpm-lock.yaml / migrations / formatting changes back to that branch.
# Used by the daily builder, whose environment cannot reach the npm registry.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - name: Generate DB migrations if missing
        if: hashFiles('packages/db/drizzle/**') == ''
        run: pnpm --filter @nodepress/db db:generate
      - run: pnpm format
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh lockfile, migrations and formatting"
            git push
          fi
