# Fly.io: copy to the repository root as fly.toml, change `app`, then:
#   fly volume create nodepress_data --size 1
#   fly secrets set ADMIN_EMAIL=you@example.com ADMIN_PASSWORD=... SITE_URL=https://<app>.fly.dev
#   fly deploy
app = "nodepress-change-me"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "true"

[[mounts]]
  source = "nodepress_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
